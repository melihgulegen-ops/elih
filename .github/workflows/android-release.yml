name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: bun install

      - name: Build offline web app
        run: bun run build

      - name: Collect files for APK
        run: |
          set -e
          if [ -f .output/public/index.html ]; then
            SRC=.output/public
          else
            SRC=$(dirname "$(find .output -name index.html | head -n 1)")
          fi
          echo "Kaynak: $SRC"
          rm -rf www && mkdir -p www
          cp -a "$SRC"/. www/
          test -f www/index.html

      - name: Create Android project
        run: |
          [ -d android ] || bunx cap add android
          bunx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk melihistan-offline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: melihistan-offline-apk
          path: melihistan-offline.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: melihistan-offline.apk
